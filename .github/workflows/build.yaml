name: GLSnake CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgl1-mesa-dev

      - name: Meson setup
        run: meson setup build -Dbuildtype=release

      - name: Meson compile
        run: meson compile -C build

      - name: Verify binary
        run: test -x build/snake

  build-macos:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_mixer sdl2_ttf meson ninja pkgconf

      - name: Meson setup
        run: meson setup build -Dbuildtype=release

      - name: Meson compile
        run: meson compile -C build

      - name: Verify binary
        run: test -x build/snake

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Scoop)
        uses: MinoruSekine/setup-scoop@v4.0.2
        with:
          apps: meson vcpkg pkg-config ninja

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Meson setup
        run: meson setup build --backend ninja --vsenv -Dbuildtype=release

      - name: Meson compile
        run: meson compile -C build

      - name: Verify binary and runtime DLLs
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath build/snake.exe)) {
            throw "build/snake.exe not found"
          }
          $dlls = Get-ChildItem -LiteralPath build -Filter '*.dll' -File
          if ($dlls.Count -lt 1) {
            throw "Expected vcpkg DLLs next to snake.exe in build/"
          }
